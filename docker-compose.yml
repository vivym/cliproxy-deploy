name: new-api

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=new-api-edge"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Docker socket access lets Traefik inspect containers and should be
      # treated as host-level Docker API access even with a read-only mount.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - edge

  sub2api-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      POSTGRES_DB: ${SUB2API_POSTGRES_DB:?set SUB2API_POSTGRES_DB}
      POSTGRES_USER: ${SUB2API_POSTGRES_USER:?set SUB2API_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?set SUB2API_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - "./sub2api-postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUB2API_POSTGRES_USER:?set SUB2API_POSTGRES_USER} -d ${SUB2API_POSTGRES_DB:?set SUB2API_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sub2api-data

  sub2api-redis:
    image: redis:8-alpine
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    command: >
      sh -c '
        redis-server
        --save 60 1
        --appendonly yes
        --appendfsync everysec
        ${SUB2API_REDIS_PASSWORD:+--requirepass "$SUB2API_REDIS_PASSWORD"}'
    volumes:
      - "./sub2api-redis-data:/data"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDISCLI_AUTH: ${SUB2API_REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sub2api-data

  sub2api:
    image: weishaw/sub2api:${SUB2API_IMAGE_TAG:-latest}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    depends_on:
      sub2api-postgres:
        condition: service_healthy
      sub2api-redis:
        condition: service_healthy
    volumes:
      - "./sub2api-data:/app/data"
    expose:
      - "8080"
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: ${SERVER_MODE:-release}
      RUN_MODE: ${RUN_MODE:-standard}
      SERVER_FRONTEND_URL: https://${SUB2API_ADMIN_HOST:?set SUB2API_ADMIN_HOST}
      SERVER_TRUSTED_PROXIES: ${EDGE_SUBNET:-172.31.20.0/24}
      DATABASE_HOST: sub2api-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${SUB2API_POSTGRES_USER:?set SUB2API_POSTGRES_USER}
      DATABASE_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?set SUB2API_POSTGRES_PASSWORD}
      DATABASE_DBNAME: ${SUB2API_POSTGRES_DB:?set SUB2API_POSTGRES_DB}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-50}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      DATABASE_CONN_MAX_LIFETIME_MINUTES: ${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      DATABASE_CONN_MAX_IDLE_TIME_MINUTES: ${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}
      REDIS_HOST: sub2api-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${SUB2API_REDIS_PASSWORD:?set SUB2API_REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-1024}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-10}
      REDIS_ENABLE_TLS: ${REDIS_ENABLE_TLS:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sub2api.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRE_HOUR: ${JWT_EXPIRE_HOUR:-24}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
      TZ: ${TZ:-Asia/Shanghai}
      SECURITY_URL_ALLOWLIST_ENABLED: ${SECURITY_URL_ALLOWLIST_ENABLED:-true}
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: ${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-false}
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: ${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-false}
      SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS: ${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-api.openai.com,api.anthropic.com,api.kimi.com,open.bigmodel.cn,api.minimaxi.com,generativelanguage.googleapis.com,cloudcode-pa.googleapis.com,*.openai.azure.com}
      UPDATE_PROXY_URL: ${UPDATE_PROXY_URL:-}
      GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT: ${GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT:-900}
      GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL: ${GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL:-10}
      GATEWAY_IMAGE_CONCURRENCY_ENABLED: ${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS: ${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE: ${GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE:-reject}
      GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS: ${GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-30}
      GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS: ${GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS:-100}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "5",
          "-O",
          "/dev/null",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - edge
      - sub2api-data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=new-api-edge"
      - "traefik.http.services.sub2api.loadbalancer.server.port=8080"
      - "traefik.http.routers.sub2api-admin.rule=Host(`${SUB2API_ADMIN_HOST:?set SUB2API_ADMIN_HOST}`) && !PathPrefix(`/v1`)"
      - "traefik.http.routers.sub2api-admin.entrypoints=websecure"
      - "traefik.http.routers.sub2api-admin.tls=true"
      - "traefik.http.routers.sub2api-admin.tls.certresolver=le"
      - "traefik.http.routers.sub2api-admin.service=sub2api"

  new-api-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEW_API_POSTGRES_DB:?set NEW_API_POSTGRES_DB}
      POSTGRES_USER: ${NEW_API_POSTGRES_USER:?set NEW_API_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NEW_API_POSTGRES_PASSWORD:?set NEW_API_POSTGRES_PASSWORD}
    volumes:
      - "new-api-postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEW_API_POSTGRES_USER:?set NEW_API_POSTGRES_USER} -d ${NEW_API_POSTGRES_DB:?set NEW_API_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - new-api-data

  new-api-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${NEW_API_REDIS_PASSWORD:?set NEW_API_REDIS_PASSWORD}"]
    volumes:
      - "new-api-redis-data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NEW_API_REDIS_PASSWORD:?set NEW_API_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - new-api-data

  new-api:
    image: calciumion/new-api:${NEW_API_IMAGE_TAG:?set NEW_API_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      new-api-postgres:
        condition: service_healthy
      new-api-redis:
        condition: service_healthy
      sub2api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SQL_DSN: postgresql://${NEW_API_POSTGRES_USER:?set NEW_API_POSTGRES_USER}:${NEW_API_POSTGRES_PASSWORD:?set NEW_API_POSTGRES_PASSWORD}@new-api-postgres:5432/${NEW_API_POSTGRES_DB:?set NEW_API_POSTGRES_DB}
      REDIS_CONN_STRING: redis://default:${NEW_API_REDIS_PASSWORD:?set NEW_API_REDIS_PASSWORD}@new-api-redis:6379
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:?set NEW_API_SESSION_SECRET}
      CRYPTO_SECRET: ${NEW_API_CRYPTO_SECRET:?set NEW_API_CRYPTO_SECRET}
      MEMORY_CACHE_ENABLED: "true"
      STREAMING_TIMEOUT: "300"
      CHANNEL_UPDATE_FREQUENCY: "1440"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "3000"
    networks:
      - edge
      - new-api-data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=new-api-edge"
      - "traefik.http.services.new-api.loadbalancer.server.port=3000"
      - "traefik.http.routers.new-api.rule=Host(`${NEW_API_HOST:?set NEW_API_HOST}`)"
      - "traefik.http.routers.new-api.entrypoints=websecure"
      - "traefik.http.routers.new-api.tls=true"
      - "traefik.http.routers.new-api.tls.certresolver=le"
      - "traefik.http.routers.new-api.service=new-api"

networks:
  edge:
    name: new-api-edge
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.31.20.0/24}
  sub2api-data:
    name: new-api-sub2api-data
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${SUB2API_DATA_SUBNET:-172.31.21.0/24}
  new-api-data:
    name: new-api-data
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${NEW_API_DATA_SUBNET:-172.31.22.0/24}

volumes:
  new-api-postgres-data:
    name: new-api-postgres-data
  new-api-redis-data:
    name: new-api-redis-data
