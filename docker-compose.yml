name: new-api

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=new-api-edge"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Docker socket access lets Traefik inspect containers and should be
      # treated as host-level Docker API access even with a read-only mount.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - edge

  sub2api-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      POSTGRES_DB: ${SUB2API_POSTGRES_DB:?set SUB2API_POSTGRES_DB}
      POSTGRES_USER: ${SUB2API_POSTGRES_USER:?set SUB2API_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?set SUB2API_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - "./sub2api-postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUB2API_POSTGRES_USER:?set SUB2API_POSTGRES_USER} -d ${SUB2API_POSTGRES_DB:?set SUB2API_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sub2api-data

  sub2api-redis:
    image: redis:8-alpine
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    command: >
      sh -c '
        redis-server
        --save 60 1
        --appendonly yes
        --appendfsync everysec
        ${SUB2API_REDIS_PASSWORD:+--requirepass "$SUB2API_REDIS_PASSWORD"}'
    volumes:
      - "./sub2api-redis-data:/data"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDISCLI_AUTH: ${SUB2API_REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sub2api-data

  sub2api:
    image: weishaw/sub2api:${SUB2API_IMAGE_TAG:-latest}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    depends_on:
      sub2api-postgres:
        condition: service_healthy
      sub2api-redis:
        condition: service_healthy
    volumes:
      - "./sub2api-data:/app/data"
    expose:
      - "8080"
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: ${SERVER_MODE:-release}
      RUN_MODE: ${RUN_MODE:-standard}
      SERVER_FRONTEND_URL: https://${SUB2API_ADMIN_HOST:?set SUB2API_ADMIN_HOST}
      SERVER_TRUSTED_PROXIES: ${EDGE_SUBNET:-172.31.20.0/24}
      DATABASE_HOST: sub2api-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${SUB2API_POSTGRES_USER:?set SUB2API_POSTGRES_USER}
      DATABASE_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?set SUB2API_POSTGRES_PASSWORD}
      DATABASE_DBNAME: ${SUB2API_POSTGRES_DB:?set SUB2API_POSTGRES_DB}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-50}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      DATABASE_CONN_MAX_LIFETIME_MINUTES: ${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      DATABASE_CONN_MAX_IDLE_TIME_MINUTES: ${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}
      REDIS_HOST: sub2api-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${SUB2API_REDIS_PASSWORD:?set SUB2API_REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-1024}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-10}
      REDIS_ENABLE_TLS: ${REDIS_ENABLE_TLS:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sub2api.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRE_HOUR: ${JWT_EXPIRE_HOUR:-24}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
      TZ: ${TZ:-Asia/Shanghai}
      SECURITY_URL_ALLOWLIST_ENABLED: ${SECURITY_URL_ALLOWLIST_ENABLED:-true}
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: ${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-false}
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: ${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-false}
      SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS: ${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-api.openai.com,api.anthropic.com,api.kimi.com,open.bigmodel.cn,api.minimaxi.com,generativelanguage.googleapis.com,cloudcode-pa.googleapis.com,*.openai.azure.com}
      UPDATE_PROXY_URL: ${UPDATE_PROXY_URL:-}
      GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT: ${GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT:-900}
      GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL: ${GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL:-10}
      GATEWAY_IMAGE_CONCURRENCY_ENABLED: ${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS: ${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE: ${GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE:-reject}
      GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS: ${GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-30}
      GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS: ${GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS:-100}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "5",
          "-O",
          "/dev/null",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - edge
      - sub2api-data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=new-api-edge"
      - "traefik.http.services.sub2api.loadbalancer.server.port=8080"
      - "traefik.http.routers.sub2api-admin.rule=Host(`${SUB2API_ADMIN_HOST:?set SUB2API_ADMIN_HOST}`) && !PathPrefix(`/v1`)"
      - "traefik.http.routers.sub2api-admin.entrypoints=websecure"
      - "traefik.http.routers.sub2api-admin.tls=true"
      - "traefik.http.routers.sub2api-admin.tls.certresolver=le"
      - "traefik.http.routers.sub2api-admin.service=sub2api"

  new-api-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEW_API_POSTGRES_DB:?set NEW_API_POSTGRES_DB}
      POSTGRES_USER: ${NEW_API_POSTGRES_USER:?set NEW_API_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NEW_API_POSTGRES_PASSWORD:?set NEW_API_POSTGRES_PASSWORD}
    volumes:
      - "new-api-postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEW_API_POSTGRES_USER:?set NEW_API_POSTGRES_USER} -d ${NEW_API_POSTGRES_DB:?set NEW_API_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - new-api-data

  new-api-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${NEW_API_REDIS_PASSWORD:?set NEW_API_REDIS_PASSWORD}"]
    volumes:
      - "new-api-redis-data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NEW_API_REDIS_PASSWORD:?set NEW_API_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - new-api-data

  new-api:
    image: ${NEW_API_IMAGE_REPOSITORY:?set NEW_API_IMAGE_REPOSITORY}:${NEW_API_IMAGE_TAG:?set NEW_API_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      new-api-postgres:
        condition: service_healthy
      new-api-redis:
        condition: service_healthy
      sub2api:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -e /run/lark-ops/maintenance.lock ]; then
          echo "refusing to start New API while deployment maintenance is active" >&2
          exit 1
        fi
        exec /new-api
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SQL_DSN: postgresql://${NEW_API_POSTGRES_USER:?set NEW_API_POSTGRES_USER}:${NEW_API_POSTGRES_PASSWORD:?set NEW_API_POSTGRES_PASSWORD}@new-api-postgres:5432/${NEW_API_POSTGRES_DB:?set NEW_API_POSTGRES_DB}
      REDIS_CONN_STRING: redis://default:${NEW_API_REDIS_PASSWORD:?set NEW_API_REDIS_PASSWORD}@new-api-redis:6379
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:?set NEW_API_SESSION_SECRET}
      CRYPTO_SECRET: ${NEW_API_CRYPTO_SECRET:?set NEW_API_CRYPTO_SECRET}
      MEMORY_CACHE_ENABLED: "true"
      STREAMING_TIMEOUT: "300"
      CHANNEL_UPDATE_FREQUENCY: "1440"
      INTEGRATION_LISTEN_ADDR: ${NEW_API_INTEGRATION_LISTEN_ADDR:-}
      LARK_INTEGRATION_SECRET_FILE: /run/secrets/lark-controller/shared/lark_integration_secret
      LARK_INTEGRATION_SECRET_NEXT_FILE: ${NEW_API_LARK_INTEGRATION_SECRET_NEXT_FILE:-}
    volumes:
      - "./lark-runtime/secrets/shared:/run/secrets/lark-controller/shared:ro"
      - "./lark-runtime/ops:/run/lark-ops:ro"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "3000"
      - "3001"
    networks:
      - edge
      - new-api-data
      - lark-integration
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=new-api-edge"
      - "traefik.http.services.new-api.loadbalancer.server.port=3000"
      - "traefik.http.routers.new-api.rule=Host(`${NEW_API_HOST:?set NEW_API_HOST}`)"
      - "traefik.http.routers.new-api.entrypoints=websecure"
      - "traefik.http.routers.new-api.tls=true"
      - "traefik.http.routers.new-api.tls.certresolver=le"
      - "traefik.http.routers.new-api.service=new-api"

  lark-quota-controller:
    profiles: ["lark"]
    image: ${LARK_CONTROLLER_IMAGE_REPOSITORY:-ghcr.io/vivym/lark-quota-controller}:${LARK_CONTROLLER_IMAGE_TAG:-local}
    build:
      context: ./lark-controller
      dockerfile: Dockerfile
      target: controller
    restart: unless-stopped
    depends_on:
      new-api:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -e /run/lark-ops/maintenance.lock ]; then
          echo "refusing to start Lark Controller while deployment maintenance is active" >&2
          exit 1
        fi
        if [ ! -f /etc/lark-controller/runtime/controller.env ]; then
          echo "refusing to start Lark Controller without compiled runtime configuration" >&2
          exit 1
        fi
        set -a
        . /etc/lark-controller/runtime/controller.env
        set +a
        exec /usr/local/bin/lark-controller
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      LARK_CONTROLLER_MODE: ${LARK_CONTROLLER_MODE:-shadow}
      LARK_CONTROLLER_LISTEN_ADDR: 0.0.0.0:8080
      LARK_CONTROLLER_DB_PATH: /var/lib/lark-controller/controller.sqlite
      LARK_VERIFICATION_TOKEN_FILE: /run/secrets/lark-controller/controller/lark_verification_token
      LARK_ENCRYPT_KEY_FILE: /run/secrets/lark-controller/controller/lark_encrypt_key
      LARK_APPROVAL_LOCALE: zh-CN
      LARK_POLICY_BUNDLE_DIR: /etc/lark-controller/policies
      LARK_APPROVAL_BINDINGS_FILE: /etc/lark-controller/policies/approval-bindings.json
      NEW_API_INTERNAL_BASE_URL: http://new-api:3001
      LARK_RECONCILIATION_HEALTH_OPEN_ID: ${LARK_RECONCILIATION_HEALTH_OPEN_ID:-}
      LARK_RECONCILIATION_INTERVAL: ${LARK_RECONCILIATION_INTERVAL:-24h}
      LARK_APPROVAL_RECONCILIATION_INTERVAL: ${LARK_APPROVAL_RECONCILIATION_INTERVAL:-15m}
      LARK_APPROVAL_RECONCILIATION_LOOKBACK: ${LARK_APPROVAL_RECONCILIATION_LOOKBACK:-72h}
      LARK_OAUTH_PUBLIC_ENABLED: ${LARK_OAUTH_PUBLIC_ENABLED:-false}
      LARK_OAUTH_RATE_LIMIT_PER_MINUTE: ${LARK_OAUTH_RATE_LIMIT_PER_MINUTE:-30}
      LARK_OAUTH_TRUSTED_PROXY_CIDRS: ${LARK_OAUTH_TRUSTED_PROXY_CIDRS:-172.31.20.0/24}
      LARK_PROCESSING_LEASE_TIMEOUT: ${LARK_PROCESSING_LEASE_TIMEOUT:-5m}
      LARK_PROCESSING_RECOVERY_INTERVAL: ${LARK_PROCESSING_RECOVERY_INTERVAL:-1m}
    volumes:
      - "lark-controller-data:/var/lib/lark-controller"
      - "./lark-runtime/policies:/etc/lark-controller/policies:ro"
      - "./lark-runtime/runtime:/etc/lark-controller/runtime:ro"
      - "./lark-runtime/secrets/shared:/run/secrets/lark-controller/shared:ro"
      - "./lark-runtime/secrets/controller:/run/secrets/lark-controller/controller:ro"
      - "./lark-runtime/ops:/run/lark-ops:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "8080"
    networks:
      - edge
      - lark-integration
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=new-api-edge"
      - "traefik.http.services.lark-controller.loadbalancer.server.port=8080"
      - "traefik.http.routers.lark-events.rule=Host(`${NEW_API_HOST:?set NEW_API_HOST}`) && Path(`/integrations/lark/events`)"
      - "traefik.http.routers.lark-events.priority=200"
      - "traefik.http.routers.lark-events.entrypoints=websecure"
      - "traefik.http.routers.lark-events.tls=true"
      - "traefik.http.routers.lark-events.tls.certresolver=le"
      - "traefik.http.routers.lark-events.service=lark-controller"
      - "traefik.http.routers.lark-oauth.rule=Host(`${NEW_API_HOST:?set NEW_API_HOST}`) && (Path(`/integrations/lark/oauth/authorize`) || Path(`/integrations/lark/oauth/callback`))"
      - "traefik.http.routers.lark-oauth.priority=200"
      - "traefik.http.routers.lark-oauth.entrypoints=websecure"
      - "traefik.http.routers.lark-oauth.tls=true"
      - "traefik.http.routers.lark-oauth.tls.certresolver=le"
      - "traefik.http.routers.lark-oauth.service=lark-controller"

  new-api-config-endpoint:
    profiles: ["lark-config"]
    image: ${NEW_API_IMAGE_REPOSITORY:?set NEW_API_IMAGE_REPOSITORY}:${NEW_API_IMAGE_TAG:?set NEW_API_IMAGE_TAG}
    restart: "no"
    depends_on:
      new-api-postgres:
        condition: service_healthy
      new-api-redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -e /run/lark-ops/maintenance.lock ]; then
          echo "refusing to start New API configuration endpoint while deployment maintenance is active" >&2
          exit 1
        fi
        exec /new-api
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SQL_DSN: postgresql://${NEW_API_POSTGRES_USER:?set NEW_API_POSTGRES_USER}:${NEW_API_POSTGRES_PASSWORD:?set NEW_API_POSTGRES_PASSWORD}@new-api-postgres:5432/${NEW_API_POSTGRES_DB:?set NEW_API_POSTGRES_DB}
      REDIS_CONN_STRING: redis://default:${NEW_API_REDIS_PASSWORD:?set NEW_API_REDIS_PASSWORD}@new-api-redis:6379
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:?set NEW_API_SESSION_SECRET}
      CRYPTO_SECRET: ${NEW_API_CRYPTO_SECRET:?set NEW_API_CRYPTO_SECRET}
      MEMORY_CACHE_ENABLED: "true"
      STREAMING_TIMEOUT: "300"
      CHANNEL_UPDATE_FREQUENCY: "1440"
      INTEGRATION_LISTEN_ADDR: 0.0.0.0:3001
      LARK_CONFIG_SECRET_FILE: /run/secrets/lark-config/lark_config_secret
      LARK_CONFIG_BRIDGE_CLIENT_SECRET_FILE: /run/secrets/lark-config/new_api_bridge_client_secret
      LARK_CONFIG_BRIDGE_CLIENT_SECRET_REF: new_api_bridge_client_secret
      LARK_CONFIG_MAINTENANCE_MODE_FILE: /run/lark-ops/maintenance.lock/mode
    volumes:
      - type: bind
        source: ./lark-runtime/secrets/config/lark_config_secret
        target: /run/secrets/lark-config/lark_config_secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./lark-runtime/secrets/controller/new_api_bridge_client_secret
        target: /run/secrets/lark-config/new_api_bridge_client_secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./lark-runtime/ops
        target: /run/lark-ops
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:3000/api/status && wget -S -O /dev/null -T 3 http://127.0.0.1:3001/api/integrations/v1/config/state 2>&1 | grep -q ' 401 '"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    expose:
      - "3001"
    networks:
      - new-api-data
      - lark-config

  lark-config:
    profiles: ["lark-config"]
    image: ${LARK_CONFIG_IMAGE_REPOSITORY:-new-api-lark-config}:${LARK_CONFIG_IMAGE_TAG:-local}
    build:
      context: ./lark-controller
      dockerfile: Dockerfile
      target: config
    restart: "no"
    depends_on:
      new-api-config-endpoint:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    working_dir: /workspace
    environment:
      HOME: /var/lib/lark-controller
    volumes:
      - "lark-config-cli-data:/var/lib/lark-controller"
      - type: bind
        source: ./lark-runtime/config
        target: /workspace/lark-runtime/config
        bind:
          create_host_path: false
      - type: bind
        source: ./lark-runtime/policies
        target: /workspace/lark-runtime/policies
        bind:
          create_host_path: false
      - type: bind
        source: ./lark-runtime/new-api
        target: /workspace/lark-runtime/new-api
        bind:
          create_host_path: false
      - type: bind
        source: ./lark-runtime/lark
        target: /workspace/lark-runtime/lark
        bind:
          create_host_path: false
      - type: bind
        source: ./lark-runtime/runtime
        target: /workspace/lark-runtime/runtime
        bind:
          create_host_path: false
      - type: bind
        source: ./lark-runtime/receipts
        target: /workspace/lark-runtime/receipts
        bind:
          create_host_path: false
      - type: bind
        source: ./lark-runtime/ops
        target: /workspace/lark-runtime/ops
        bind:
          create_host_path: false
      - type: bind
        source: ./lark-runtime/secrets/config/lark_config_secret
        target: /run/secrets/lark-config/lark_config_secret
        read_only: true
        bind:
          create_host_path: false
    networks:
      - lark-config
      - lark-config-egress

  new-api-correction-endpoint:
    profiles: ["lark-ops"]
    image: ${NEW_API_IMAGE_REPOSITORY:?set NEW_API_IMAGE_REPOSITORY}:${NEW_API_IMAGE_TAG:?set NEW_API_IMAGE_TAG}
    restart: "no"
    depends_on:
      new-api-postgres:
        condition: service_healthy
      new-api-redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$(cat /run/lark-ops/maintenance.lock/mode 2>/dev/null || true)" != "correction" ]; then
          echo "refusing to start without the host-side Lark correction maintenance lock in correction mode" >&2
          exit 1
        fi
        exec /new-api
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SQL_DSN: postgresql://${NEW_API_POSTGRES_USER:?set NEW_API_POSTGRES_USER}:${NEW_API_POSTGRES_PASSWORD:?set NEW_API_POSTGRES_PASSWORD}@new-api-postgres:5432/${NEW_API_POSTGRES_DB:?set NEW_API_POSTGRES_DB}
      REDIS_CONN_STRING: redis://default:${NEW_API_REDIS_PASSWORD:?set NEW_API_REDIS_PASSWORD}@new-api-redis:6379
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:?set NEW_API_SESSION_SECRET}
      CRYPTO_SECRET: ${NEW_API_CRYPTO_SECRET:?set NEW_API_CRYPTO_SECRET}
      MEMORY_CACHE_ENABLED: "true"
      STREAMING_TIMEOUT: "300"
      CHANNEL_UPDATE_FREQUENCY: "1440"
      INTEGRATION_LISTEN_ADDR: 0.0.0.0:3001
      LARK_INTEGRATION_SECRET_FILE: /run/secrets/lark-controller/shared/lark_integration_secret
      LARK_INTEGRATION_SECRET_NEXT_FILE: ${NEW_API_LARK_INTEGRATION_SECRET_NEXT_FILE:-}
      LARK_CORRECTION_SECRET_FILE: /run/secrets/lark-controller/new-api/lark_correction_secret
    volumes:
      - "./lark-runtime/secrets/shared:/run/secrets/lark-controller/shared:ro"
      - "./lark-runtime/secrets/new-api:/run/secrets/lark-controller/new-api:ro"
      - "./lark-runtime/ops:/run/lark-ops:ro"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:3000/api/status && wget -S -O /dev/null -T 3 http://127.0.0.1:3001/api/integrations/v1/principals 2>&1 | grep -q ' 401 '"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    expose:
      - "3001"
    networks:
      - new-api-data
      - lark-integration

  lark-correction-readonly:
    profiles: ["lark-ops"]
    image: ${LARK_CORRECTION_IMAGE_REPOSITORY:-new-api-lark-correction}:${LARK_CORRECTION_IMAGE_TAG:-local}
    build:
      context: ./lark-controller
      dockerfile: Dockerfile
      target: correction
    restart: "no"
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "lark-controller-data:/var/lib/lark-controller:ro"

  lark-correction:
    profiles: ["lark-ops"]
    image: ${LARK_CORRECTION_IMAGE_REPOSITORY:-new-api-lark-correction}:${LARK_CORRECTION_IMAGE_TAG:-local}
    build:
      context: ./lark-controller
      dockerfile: Dockerfile
      target: correction
    restart: "no"
    depends_on:
      new-api-correction-endpoint:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$(cat /run/lark-ops/maintenance.lock/mode 2>/dev/null || true)" != "correction" ]; then
          echo "refusing to run without the host-side Lark correction maintenance lock in correction mode" >&2
          exit 1
        fi
        exec /usr/local/bin/lark-correction "$@"
      - lark-correction
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "lark-controller-data:/var/lib/lark-controller"
      - "./lark-runtime/secrets/new-api:/run/secrets/lark-controller/new-api:ro"
      - "./lark-runtime/ops:/run/lark-ops:ro"
    networks:
      - lark-integration

networks:
  edge:
    name: new-api-edge
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.31.20.0/24}
  sub2api-data:
    name: new-api-sub2api-data
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${SUB2API_DATA_SUBNET:-172.31.21.0/24}
  new-api-data:
    name: new-api-data
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${NEW_API_DATA_SUBNET:-172.31.22.0/24}
  lark-integration:
    name: new-api-lark-integration
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${LARK_INTEGRATION_SUBNET:-172.31.23.0/24}
  lark-config:
    name: new-api-lark-config
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${LARK_CONFIG_SUBNET:-172.31.24.0/24}
  lark-config-egress:
    name: new-api-lark-config-egress
    driver: bridge
    ipam:
      config:
        - subnet: ${LARK_CONFIG_EGRESS_SUBNET:-172.31.25.0/24}

volumes:
  new-api-postgres-data:
    name: new-api-postgres-data
  new-api-redis-data:
    name: new-api-redis-data
  lark-controller-data:
    name: new-api-lark-controller-data
  lark-config-cli-data:
    name: new-api-lark-config-cli-data
