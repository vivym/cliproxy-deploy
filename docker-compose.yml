name: sub2api

services:
  traefik:
    image: traefik:v3.6
    container_name: sub2api-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=sub2api-proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Docker socket access lets Traefik inspect containers and should be
      # treated as host-level Docker API access even with a read-only mount.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - proxy

  postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - "./postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${POSTGRES_DB:?set POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:8-alpine
    container_name: sub2api-redis
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    command: >
      sh -c '
        redis-server
        --save 60 1
        --appendonly yes
        --appendfsync everysec
        ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    volumes:
      - "./redis_data:/data"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  sub2api:
    image: weishaw/sub2api:${SUB2API_IMAGE_TAG:-latest}
    container_name: sub2api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - "./data:/app/data"
    expose:
      - "8080"
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: ${SERVER_MODE:-release}
      RUN_MODE: ${RUN_MODE:-standard}
      SERVER_FRONTEND_URL: https://${SUB2API_ADMIN_HOST:?set SUB2API_ADMIN_HOST}
      SERVER_TRUSTED_PROXIES: ${SUB2API_PROXY_SUBNET:-172.31.10.0/24}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DATABASE_DBNAME: ${POSTGRES_DB:?set POSTGRES_DB}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-50}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      DATABASE_CONN_MAX_LIFETIME_MINUTES: ${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      DATABASE_CONN_MAX_IDLE_TIME_MINUTES: ${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-1024}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-10}
      REDIS_ENABLE_TLS: ${REDIS_ENABLE_TLS:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sub2api.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRE_HOUR: ${JWT_EXPIRE_HOUR:-24}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
      TZ: ${TZ:-Asia/Shanghai}
      SECURITY_URL_ALLOWLIST_ENABLED: ${SECURITY_URL_ALLOWLIST_ENABLED:-true}
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: ${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-false}
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: ${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-false}
      SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS: ${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-api.openai.com,api.anthropic.com,api.kimi.com,open.bigmodel.cn,api.minimaxi.com,generativelanguage.googleapis.com,cloudcode-pa.googleapis.com,*.openai.azure.com}
      UPDATE_PROXY_URL: ${UPDATE_PROXY_URL:-}
      GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT: ${GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT:-900}
      GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL: ${GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL:-10}
      GATEWAY_IMAGE_CONCURRENCY_ENABLED: ${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS: ${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE: ${GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE:-reject}
      GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS: ${GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-30}
      GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS: ${GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS:-100}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "5",
          "-O",
          "/dev/null",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=sub2api-proxy"
      - "traefik.http.services.sub2api.loadbalancer.server.port=8080"
      - "traefik.http.routers.sub2api-api.rule=Host(`${SUB2API_HOST:?set SUB2API_HOST}`)"
      - "traefik.http.routers.sub2api-api.entrypoints=websecure"
      - "traefik.http.routers.sub2api-api.tls=true"
      - "traefik.http.routers.sub2api-api.tls.certresolver=le"
      - "traefik.http.routers.sub2api-api.service=sub2api"
      - "traefik.http.routers.sub2api-admin.rule=Host(`${SUB2API_ADMIN_HOST:?set SUB2API_ADMIN_HOST}`)"
      - "traefik.http.routers.sub2api-admin.entrypoints=websecure"
      - "traefik.http.routers.sub2api-admin.tls=true"
      - "traefik.http.routers.sub2api-admin.tls.certresolver=le"
      - "traefik.http.routers.sub2api-admin.service=sub2api"

networks:
  proxy:
    name: sub2api-proxy
    driver: bridge
    ipam:
      config:
        - subnet: ${SUB2API_PROXY_SUBNET:-172.31.10.0/24}
  backend:
    name: sub2api-backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${SUB2API_BACKEND_SUBNET:-172.31.11.0/24}
