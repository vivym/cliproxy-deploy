services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Docker socket access lets Traefik inspect containers and should be
      # treated as host-level Docker API access even with a read-only mount.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - proxy

  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    container_name: cliproxyapi
    restart: unless-stopped
    pull_policy: always
    environment:
      DEPLOY: ${DEPLOY:-}
    volumes:
      - "./config.yaml:/CLIProxyAPI/config.yaml"
      - "./auths:/root/.cli-proxy-api"
      - "./logs:/CLIProxyAPI/logs"
    expose:
      - "8317"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # Shared service definition.
      - "traefik.http.services.cliproxyapi.loadbalancer.server.port=8317"

      # Single public hostname. CLIProxyAPI handles API key auth for /v1/*
      # and management-secret auth for /v0/management/*.
      - "traefik.http.routers.cliproxyapi.rule=Host(`${API_HOST:?set API_HOST}`)"
      - "traefik.http.routers.cliproxyapi.entrypoints=websecure"
      - "traefik.http.routers.cliproxyapi.tls=true"
      - "traefik.http.routers.cliproxyapi.tls.certresolver=le"
      - "traefik.http.routers.cliproxyapi.service=cliproxyapi"

networks:
  proxy:
    name: proxy
