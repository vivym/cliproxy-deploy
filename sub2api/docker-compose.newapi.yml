services:
  newapi-postgres:
    image: postgres:16-alpine
    container_name: newapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEWAPI_POSTGRES_DB:?set NEWAPI_POSTGRES_DB}
      POSTGRES_USER: ${NEWAPI_POSTGRES_USER:?set NEWAPI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NEWAPI_POSTGRES_PASSWORD:?set NEWAPI_POSTGRES_PASSWORD}
    volumes:
      - "newapi-postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEWAPI_POSTGRES_USER:?set NEWAPI_POSTGRES_USER} -d ${NEWAPI_POSTGRES_DB:?set NEWAPI_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newapi-backend

  newapi-redis:
    image: redis:7-alpine
    container_name: newapi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${NEWAPI_REDIS_PASSWORD:?set NEWAPI_REDIS_PASSWORD}"]
    volumes:
      - "newapi-redis-data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NEWAPI_REDIS_PASSWORD:?set NEWAPI_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newapi-backend

  new-api:
    image: calciumion/new-api:${NEW_API_IMAGE_TAG:?set NEW_API_IMAGE_TAG}
    container_name: new-api
    restart: unless-stopped
    depends_on:
      newapi-postgres:
        condition: service_healthy
      newapi-redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SQL_DSN: postgresql://${NEWAPI_POSTGRES_USER:?set NEWAPI_POSTGRES_USER}:${NEWAPI_POSTGRES_PASSWORD:?set NEWAPI_POSTGRES_PASSWORD}@newapi-postgres:5432/${NEWAPI_POSTGRES_DB:?set NEWAPI_POSTGRES_DB}
      REDIS_CONN_STRING: redis://default:${NEWAPI_REDIS_PASSWORD:?set NEWAPI_REDIS_PASSWORD}@newapi-redis:6379
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:?set NEW_API_SESSION_SECRET}
      CRYPTO_SECRET: ${NEW_API_CRYPTO_SECRET:?set NEW_API_CRYPTO_SECRET}
      MEMORY_CACHE_ENABLED: "true"
      STREAMING_TIMEOUT: "300"
      CHANNEL_UPDATE_FREQUENCY: "1440"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "3000"
    networks:
      - proxy
      - newapi-backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=sub2api-proxy"
      - "traefik.http.services.new-api.loadbalancer.server.port=3000"
      - "traefik.http.routers.new-api.rule=Host(`${NEW_API_HOST:?set NEW_API_HOST}`)"
      - "traefik.http.routers.new-api.entrypoints=websecure"
      - "traefik.http.routers.new-api.tls=true"
      - "traefik.http.routers.new-api.tls.certresolver=le"
      - "traefik.http.routers.new-api.service=new-api"

networks:
  proxy:
    name: sub2api-proxy
  newapi-backend:
    name: newapi-backend
    driver: bridge
    internal: true

volumes:
  newapi-postgres-data:
  newapi-redis-data:
